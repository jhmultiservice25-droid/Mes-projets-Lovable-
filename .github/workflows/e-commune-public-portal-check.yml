name: e-Commune public portal checks

on:
  pull_request:
    paths:
      - "e-commune-rdc-kasavubu-v12-officiel-portable-bureau/**"
      - ".github/workflows/e-commune-public-portal-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e-commune-rdc-kasavubu-v12-officiel-portable-bureau
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e-commune-rdc-kasavubu-v12-officiel-portable-bureau/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Build Next.js application
        run: npm run build
