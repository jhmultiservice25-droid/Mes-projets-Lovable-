<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fatshimétrie | Kinshasa</title>
<meta name="theme-color" content="#052f5f">
<style>
:root{--b:#0874c9;--d:#052f5f;--g:#f7c948;--r:#d61f2c;--bg:#f5f8fb;--m:#64748b;--l:#dbe6ef}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:#18324b;background:#fff}a{text-decoration:none;color:inherit}.wrap{width:min(1180px,calc(100% - 28px));margin:auto}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--l)}.nav{height:72px;display:flex;align-items:center;gap:14px}.brand{display:flex;gap:10px;align-items:center;margin-right:auto}.logo{width:42px;height:42px;border-radius:12px;background:var(--b);color:#fff;display:grid;place-items:center;font-weight:900}.brand strong{display:block;color:var(--d)}.brand small{color:var(--m)}.back{padding:10px 14px;border:1px solid var(--l);border-radius:10px;font-weight:700}.hero{position:relative;height:62vh;min-height:460px;background:var(--d);overflow:hidden;color:#fff}.slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .8s}.slide.on{opacity:1}.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,30,59,.92),rgba(3,30,59,.52),rgba(3,30,59,.12))}.heroContent{position:absolute;inset:0;display:flex;align-items:flex-end;padding-bottom:60px}.ey{font-size:11px;letter-spacing:.16em;font-weight:900;color:var(--g)}h1{font-size:clamp(34px,6vw,68px);line-height:1.02;margin:10px 0 16px;max-width:900px}.hero p{max-width:730px;line-height:1.6;color:#e8f3ff;font-size:17px}.dots{display:flex;gap:7px;margin-top:18px}.dots button{width:9px;height:9px;border:0;border-radius:20px;background:#ffffff70}.dots button.on{width:30px;background:var(--g)}.section{padding:48px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}.stat,.panel,.chart,.card{border:1px solid var(--l);border-radius:16px;background:#fff}.stat{padding:18px}.stat b{display:block;font-size:28px;color:var(--b)}.stat span{font-size:12px;color:var(--m)}.layout{display:grid;grid-template-columns:.85fr 1.15fr;gap:22px}.panel{padding:22px}.panel h2{margin-top:0;color:var(--d)}.territory-note{font-size:12px;color:var(--m);line-height:1.5}.kin-map{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(6,58px);gap:6px;padding:12px;background:linear-gradient(145deg,#dff1fb,#f9fcff);border:1px solid #c7ddea;border-radius:18px;min-height:410px}.commune{border:1px solid #a9cadf;background:#fff;border-radius:12px;padding:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;transition:.18s;min-width:0}.commune span{font-size:9px;font-weight:800;line-height:1.15}.commune b{font-size:16px;color:var(--b);margin-top:2px}.commune:hover,.commune.active{background:var(--b);color:#fff;border-color:var(--b);transform:translateY(-2px);box-shadow:0 8px 20px rgba(8,116,201,.2)}.commune:hover b,.commune.active b{color:var(--g)}.commune.has-project{border-width:2px;border-color:var(--b)}.projectlist{display:grid;gap:8px;max-height:460px;overflow:auto}.projectbtn{border:1px solid var(--l);background:#f9fbfd;border-radius:12px;padding:12px;text-align:left;cursor:pointer}.projectbtn b{display:block;color:var(--d)}.projectbtn span{font-size:12px;color:var(--m)}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}.filters select{padding:11px;border:1px solid var(--l);border-radius:10px;background:#fff}.chart{padding:20px;margin-bottom:22px}.bar{display:grid;grid-template-columns:220px 1fr 48px;gap:10px;align-items:center;margin:9px 0;font-size:12px}.track{height:9px;border-radius:99px;background:#e7eef4;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--b),#29b6d6)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:18px}.card h3{color:var(--d)}.card p{color:var(--m);line-height:1.5;font-size:14px}.progress{display:flex;align-items:center;gap:8px}.progress .track{flex:1}.btn{border:0;border-radius:10px;padding:11px 14px;background:var(--b);color:#fff;font-weight:800;cursor:pointer}.empty{padding:26px;text-align:center;color:var(--m);background:#f8fafc;border-radius:12px}.modalbg{position:fixed;inset:0;background:#031e3bcc;display:grid;place-items:center;z-index:50;padding:15px}.modal{width:min(840px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:24px;position:relative}.x{position:absolute;right:14px;top:10px;border:0;background:none;font-size:28px;cursor:pointer}.comment{border-left:3px solid var(--b);background:#f8fafc;padding:12px;margin:10px 0;border-radius:0 10px 10px 0}.comment.reply{margin-left:28px;border-color:var(--g)}.comment img{max-width:300px;max-height:260px;border-radius:10px;object-fit:cover}.reacts{display:flex;gap:6px;flex-wrap:wrap}.reacts button{border:1px solid var(--l);background:#fff;border-radius:20px;padding:5px 8px}.form{display:grid;gap:12px}.form input,.form textarea,.form select{width:100%;padding:11px;border:1px solid var(--l);border-radius:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.notice{padding:10px;background:#e9f8ef;color:#17643b;border-radius:8px}.err{background:#fdecef;color:#9b1c2c}.loading{padding:70px;text-align:center;color:var(--m)}@media(max-width:850px){.layout,.stats,.grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.kin-map{grid-template-columns:repeat(4,1fr);grid-template-rows:auto}.commune{min-height:58px;grid-column:auto!important;grid-row:auto!important}.bar{grid-template-columns:100px 1fr 42px}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="wrap nav"><div class="brand"><div class="logo">CPJ</div><div><strong>Fatshimétrie</strong><small>Jeunesse Connect · Province de Kinshasa</small></div></div><a class="back" href="/">← Retour au portail</a></div></header>
<main id="app"><div class="loading">Chargement de Fatshimétrie…</div></main>
<script>
const API='https://xpxvadpgsrfjqbtdmgcw.supabase.co/functions/v1/cpj-api';const app=document.getElementById('app');let projects=[],slide=0,timer=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const safe=v=>{try{const u=new URL(String(v||''),location.origin);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return''}};async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{...(opt.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(opt.headers||{})}});let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.detail||'Erreur du service');return j}
const communes=['Bandalungwa','Barumbu','Bumbu','Gombe','Kalamu','Kasa-Vubu','Kimbanseke','Kinshasa','Kintambo','Kisenso','Lemba','Limete','Lingwala','Makala','Maluku','Masina','Matete','Mont-Ngafula',"N'djili","N'sele",'Ngaba','Ngaliema','Ngiri-Ngiri','Selembao'];
const positions={'Ngaliema':[1,1,2,2],'Kintambo':[3,1,1,1],'Gombe':[4,1,1,1],'Lingwala':[3,2,1,1],'Kinshasa':[4,2,1,1],'Barumbu':[5,2,1,1],'Kasa-Vubu':[3,3,1,1],'Kalamu':[4,3,1,1],'Bandalungwa':[2,3,1,1],'Ngiri-Ngiri':[2,4,1,1],'Bumbu':[3,4,1,1],'Makala':[4,4,1,1],'Selembao':[1,4,1,2],'Ngaba':[5,4,1,1],'Lemba':[5,3,1,1],'Limete':[6,2,1,2],'Matete':[6,4,1,1],'Kisenso':[6,5,1,1],"N'djili":[7,3,1,1],'Masina':[7,2,1,1],'Kimbanseke':[7,4,1,2],"N'sele":[8,2,1,3],'Maluku':[8,5,1,2],'Mont-Ngafula':[1,6,5,1]};
function norm(v){return String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’']/g,"'").trim()}function communeProjects(name){const n=norm(name);return projects.filter(x=>norm(x.commune)===n)}function communeMap(){return communes.map(name=>{const pos=positions[name]||[1,1,1,1],rows=communeProjects(name),style=`grid-column:${pos[0]} / span ${pos[2]};grid-row:${pos[1]} / span ${pos[3]}`;return `<button class="commune ${rows.length?'has-project':''}" style="${style}" data-c="${esc(name)}" title="${esc(name)} — ${rows.length} projet(s)"><span>${esc(name)}</span><b>${rows.length}</b></button>`}).join('')}
function render(){const hero=projects.filter(x=>safe(x.image_url)).slice(0,5);const avg=projects.length?Math.round(projects.reduce((a,x)=>a+Number(x.ai_progress??x.progress??0),0)/projects.length):0;app.innerHTML=`<section class="hero">${hero.map((x,i)=>`<div class="slide ${i===0?'on':''}" style="background-image:url('${safe(x.image_url)}')"><div class="shade"></div><div class="heroContent"><div class="wrap"><span class="ey">FATSHIMÉTRIE · PROVINCE DE KINSHASA</span><h1>${esc(x.title)}</h1><p>${esc(x.summary)}</p><button class="btn open" data-id="${x.id}">Voir le projet & le chat</button><div class="dots">${hero.map((_,j)=>`<button class="dot ${j===0?'on':''}" data-i="${j}"></button>`).join('')}</div></div></div></div>`).join('')}</section><section class="section" style="background:var(--bg)"><div class="wrap"><div class="stats"><div class="stat"><b>${projects.length}</b><span>Projets suivis</span></div><div class="stat"><b>${avg}%</b><span>Avancement moyen</span></div><div class="stat"><b>${projects.reduce((a,x)=>a+(x.comment_count||0),0)}</b><span>Contributions citoyennes</span></div><div class="stat"><b>24</b><span>Communes</span></div></div><div class="layout"><div class="panel"><h2 id="unitTitle">Province de Kinshasa</h2><p id="unitText">Survolez ou cliquez une commune pour afficher ses projets.</p><div id="plist" class="projectlist">${listProjects(projects)}</div></div><div class="panel"><h2>Carte territoriale de Kinshasa</h2><p class="territory-note">Kinshasa est une ville-province : la déclinaison territoriale pertinente est celle de ses 24 communes. Dans les autres provinces, ce moteur utilisera les villes et territoires.</p><div class="kin-map">${communeMap()}</div></div></div><div class="filters"><select id="comm"><option value="">Toutes les communes</option>${communes.map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="sector"><option value="">Tous les secteurs</option>${[...new Set(projects.map(x=>x.sector).filter(Boolean))].map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="prog"><option value="">Tous niveaux</option><option value="0-25">0–25%</option><option value="26-50">26–50%</option><option value="51-75">51–75%</option><option value="76-100">76–100%</option></select></div><div class="chart"><h2>Évolution des projets</h2><div id="bars">${bars(projects)}</div></div><div id="cards" class="grid">${cards(projects)}</div></div></section>`;bind()}
function listProjects(rows){return rows.length?rows.map(x=>`<button class="projectbtn open" data-id="${x.id}"><b>${esc(x.title)}</b><span>${esc(x.commune||'Kinshasa')} · ${x.ai_progress??x.progress??0}%</span></button>`).join(''):'<div class="empty">Aucun projet publié.</div>'}function bars(rows){return rows.length?rows.map(x=>`<div class="bar"><span>${esc(x.title)}</span><div class="track"><div class="fill" style="width:${Math.max(0,Math.min(100,Number(x.ai_progress??x.progress??0)))}%"></div></div><b>${x.ai_progress??x.progress??0}%</b></div>`).join(''):'<div class="empty">Aucune donnée.</div>'}function cards(rows){return rows.length?rows.map(x=>`<article class="card"><small>${esc(x.sector||'Projet public')} · ${esc(x.commune||'Kinshasa')}</small><h3>${esc(x.title)}</h3><p>${esc(x.summary)}</p><div class="progress"><div class="track"><div class="fill" style="width:${x.ai_progress??x.progress??0}%"></div></div><b>${x.ai_progress??x.progress??0}%</b></div><p>${x.comment_count||0} commentaire(s)</p><button class="btn open" data-id="${x.id}">Voir & commenter</button></article>`).join(''):'<div class="empty">Aucun projet.</div>'}
function bind(){document.querySelectorAll('.open').forEach(b=>b.onclick=()=>openProject(projects.find(x=>x.id===b.dataset.id)));document.querySelectorAll('.dot').forEach(b=>b.onclick=()=>go(Number(b.dataset.i)));document.querySelectorAll('.commune').forEach(b=>{const show=()=>showCommune(b.dataset.c);b.addEventListener('mouseenter',show);b.addEventListener('focus',show);b.addEventListener('click',show)});['comm','sector','prog'].forEach(id=>document.getElementById(id)?.addEventListener('change',filter));clearInterval(timer);if(document.querySelectorAll('.slide').length>1)timer=setInterval(()=>go((slide+1)%document.querySelectorAll('.slide').length),5000)}function go(i){slide=i;document.querySelectorAll('.slide').forEach((x,j)=>x.classList.toggle('on',j===i));document.querySelectorAll('.dot').forEach((x,j)=>x.classList.toggle('on',j===i))}function showCommune(name){const rows=communeProjects(name);document.querySelectorAll('.commune').forEach(x=>x.classList.toggle('active',x.dataset.c===name));document.getElementById('unitTitle').textContent=name;document.getElementById('unitText').textContent=rows.length?`${rows.length} projet(s) suivi(s) dans cette commune.`:'Aucun projet publié dans cette commune.';document.getElementById('plist').innerHTML=listProjects(rows);document.getElementById('comm').value=name;document.querySelectorAll('#plist .open').forEach(b=>b.onclick=()=>openProject(projects.find(x=>x.id===b.dataset.id)))}function filter(){let rows=[...projects],c=document.getElementById('comm').value,s=document.getElementById('sector').value,p=document.getElementById('prog').value;if(c)rows=rows.filter(x=>norm(x.commune)===norm(c));if(s)rows=rows.filter(x=>x.sector===s);if(p){const[a,b]=p.split('-').map(Number);rows=rows.filter(x=>{const n=Number(x.ai_progress??x.progress??0);return n>=a&&n<=b})}document.getElementById('bars').innerHTML=bars(rows);document.getElementById('cards').innerHTML=cards(rows);document.querySelectorAll('#cards .open').forEach(b=>b.onclick=()=>openProject(projects.find(x=>x.id===b.dataset.id)))}
async function openProject(p){if(!p)return;let comments=[];try{comments=await api(`/api/public/fatshimetrie/projects/${p.id}/comments`)}catch{}const bg=document.createElement('div');bg.className='modalbg';bg.innerHTML=`<div class="modal"><button class="x">×</button><h2>${esc(p.title)}</h2><p>${esc(p.summary)}</p><p><b>Avancement :</b> ${p.ai_progress??p.progress??0}%</p><h3>Discussion citoyenne</h3><div>${commentsHtml(comments)}</div><form id="cf" class="form"><div class="two"><input required name="author_name" placeholder="Votre nom"><input name="commune" value="${esc(p.commune||'')}" placeholder="Commune"></div><textarea required name="content" placeholder="Votre commentaire"></textarea><div class="two"><select name="emoji"><option>💬</option><option>👍</option><option>👏</option><option>❤️</option><option>😟</option><option>⚠️</option></select><input type="file" name="photo" accept="image/jpeg,image/png,image/webp"></div><input type="hidden" name="parent_id"><div id="cs"></div><button class="btn">Publier</button></form></div>`;document.body.appendChild(bg);bg.querySelector('.x').onclick=()=>bg.remove();bg.onclick=e=>{if(e.target===bg)bg.remove()};bindThread(bg,p)}function commentsHtml(cs){return cs.length?cs.map(c=>`<div class="comment ${c.parent_id?'reply':''}"><b>${esc(c.author_name)}</b><p>${esc(c.emoji||'💬')} ${esc(c.content)}</p>${c.photo_url?`<img src="${safe(c.photo_url)}" alt="Photo citoyenne">`:''}<div class="reacts">${['👍','👏','❤️'].map(e=>`<button class="react" data-id="${c.id}" data-e="${e}">${e} ${c.reactions?.[e]||''}</button>`).join('')}<button class="reply" data-id="${c.id}" data-name="${esc(c.author_name)}">Répondre</button></div></div>`).join(''):'<div class="empty">Soyez le premier à commenter.</div>'}function bindThread(bg,p){bg.querySelectorAll('.reply').forEach(b=>b.onclick=()=>{bg.querySelector('[name=parent_id]').value=b.dataset.id;bg.querySelector('[name=content]').placeholder='Réponse à '+b.dataset.name;bg.querySelector('[name=content]').focus()});bg.querySelectorAll('.react').forEach(b=>b.onclick=async()=>{let sid=localStorage.getItem('cpj_session');if(!sid){sid=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random());localStorage.setItem('cpj_session',sid)}await api(`/api/public/fatshimetrie/comments/${b.dataset.id}/react`,{method:'POST',body:JSON.stringify({emoji:b.dataset.e,session_id:sid})});bg.remove();openProject(p)});bg.querySelector('#cf').onsubmit=async e=>{e.preventDefault();const st=bg.querySelector('#cs');st.innerHTML='<div class="notice">Envoi…</div>';try{await api(`/api/public/fatshimetrie/projects/${p.id}/comments`,{method:'POST',body:new FormData(e.target)});bg.remove();openProject(p)}catch(err){st.innerHTML=`<div class="notice err">${esc(err.message)}</div>`}}}
(async()=>{try{projects=await api('/api/public/fatshimetrie/projects');render()}catch(e){app.innerHTML=`<section class="section"><div class="wrap"><div class="panel"><h2>Fatshimétrie</h2><div class="notice err">${esc(e.message)}</div><p><button class="btn" onclick="location.reload()">Réessayer</button></p></div></div></section>`}})();
</script>
</body>
</html>
