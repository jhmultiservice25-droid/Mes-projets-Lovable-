<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#005aa7"><title>Jeunesse Connect | CPJ</title><style>body{margin:0;font-family:Arial,sans-serif;color:#052f5f}#boot{min-height:100vh;display:grid;place-items:center;text-align:center}#boot b{font-size:24px}#boot p{color:#62748a}</style></head><body><div id="boot"><div><b>Jeunesse Connect</b><p>Chargement de la plateforme…</p></div></div><script>(async()=>{try{const r=await fetch('https://xpxvadpgsrfjqbtdmgcw.supabase.co/functions/v1/site-snapshot-api?name=h0.txt',{cache:'no-store'});if(!r.ok)throw Error('source '+r.status);let html=await r.text();const patch="/*\n  CPJ Jeunesse Connect — Fatshimétrie national map patch\n  Load this file AFTER the current inline application script.\n  It replaces only the public Fatshimétrie page/bindings.\n*/\n\nconst FATSHI_MAP_API = 'https://xpxvadpgsrfjqbtdmgcw.supabase.co/functions/v1/fatshimetrie-map-api';\n\nasync function fatMapApi(path) {\n  const r = await fetch(FATSHI_MAP_API + path, { headers: { Accept: 'application/json' } });\n  let j = {};\n  try { j = await r.json(); } catch {}\n  if (!r.ok) throw new Error(j.detail || 'Impossible de charger la carte nationale.');\n  return j;\n}\n\nconst fatNorm = v => String(v || '')\n  .normalize('NFD').replace(/[\\u0300-\\u036f]/g, '')\n  .toLowerCase().replace(/[^a-z0-9]/g, '');\n\nfunction fatFeatureName(f) {\n  const p = f?.properties || {};\n  return p.shapeName || p.name || p.NAME_1 || p.NAME || p.province || p.admin1Name || '';\n}\n\nfunction fatUnitForFeature(f) {\n  const name = fatNorm(fatFeatureName(f));\n  return (window.__fatNational?.units || []).find(u => fatNorm(u.province) === name) || null;\n}\n\nfunction fatAllCoords(geometry, out = []) {\n  if (!geometry?.coordinates) return out;\n  const walk = x => {\n    if (Array.isArray(x) && x.length >= 2 && typeof x[0] === 'number' && typeof x[1] === 'number') out.push(x);\n    else if (Array.isArray(x)) x.forEach(walk);\n  };\n  walk(geometry.coordinates);\n  return out;\n}\n\nfunction fatPathForGeometry(geometry, project) {\n  if (!geometry) return '';\n  const ringPath = ring => ring.map((pt, i) => {\n    const [x, y] = project(pt);\n    return `${i ? 'L' : 'M'}${x.toFixed(2)},${y.toFixed(2)}`;\n  }).join(' ') + ' Z';\n  if (geometry.type === 'Polygon') return geometry.coordinates.map(ringPath).join(' ');\n  if (geometry.type === 'MultiPolygon') return geometry.coordinates.flatMap(poly => poly.map(ringPath)).join(' ');\n  return '';\n}\n\nfunction fatRenderSvgMap() {\n  const svg = document.querySelector('#rdcMapSvg');\n  const geo = window.__fatNational?.geo;\n  if (!svg || !geo?.features?.length) return;\n\n  const W = 720, H = 610, PAD = 18;\n  const coords = geo.features.flatMap(f => fatAllCoords(f.geometry, []));\n  const xs = coords.map(c => Number(c[0])), ys = coords.map(c => Number(c[1]));\n  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);\n  const spanX = maxX - minX || 1, spanY = maxY - minY || 1;\n  const scale = Math.min((W - PAD * 2) / spanX, (H - PAD * 2) / spanY);\n  const usedW = spanX * scale, usedH = spanY * scale;\n  const ox = (W - usedW) / 2, oy = (H - usedH) / 2;\n  const project = ([lon, lat]) => [ox + (lon - minX) * scale, oy + (maxY - lat) * scale];\n\n  const selected = fatNorm(window.__fatNational?.selected?.province);\n  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);\n  svg.innerHTML = geo.features.map((f, i) => {\n    const unit = fatUnitForFeature(f);\n    const province = unit?.province || fatFeatureName(f) || `Province ${i + 1}`;\n    const count = Number(unit?.project_count || 0);\n    const cls = [\n      'rdc-province-shape',\n      count ? 'has-projects' : '',\n      fatNorm(province) === selected ? 'selected' : ''\n    ].filter(Boolean).join(' ');\n    const title = `${province} — ${count} projet${count > 1 ? 's' : ''} — Voir plus de détails`;\n    return `<path class=\"${cls}\" tabindex=\"0\" role=\"button\" aria-label=\"${esc(title)}\" data-province=\"${esc(province)}\" d=\"${fatPathForGeometry(f.geometry, project)}\"><title>${esc(title)}</title></path>`;\n  }).join('');\n}\n\nfunction fatTooltipShow(evt, province) {\n  const tip = document.querySelector('#rdcMapTooltip');\n  const shell = document.querySelector('.rdc-map-shell');\n  if (!tip || !shell) return;\n  const unit = (window.__fatNational?.units || []).find(u => fatNorm(u.province) === fatNorm(province));\n  const count = Number(unit?.project_count || 0);\n  tip.innerHTML = `<strong>${esc(unit?.province || province)}</strong><span>${count} projet${count > 1 ? 's' : ''}</span><b>Voir plus de détails →</b>`;\n  tip.hidden = false;\n  const r = shell.getBoundingClientRect();\n  const clientX = evt?.clientX || (r.left + r.width / 2);\n  const clientY = evt?.clientY || (r.top + 90);\n  tip.style.left = `${Math.max(12, Math.min(r.width - 190, clientX - r.left + 14))}px`;\n  tip.style.top = `${Math.max(12, Math.min(r.height - 94, clientY - r.top + 14))}px`;\n}\n\nfunction fatTooltipHide() {\n  const tip = document.querySelector('#rdcMapTooltip');\n  if (tip) tip.hidden = true;\n}\n\nfunction fatSelectedRows() {\n  return Array.isArray(state.fatshi) ? state.fatshi : [];\n}\n\nfunction fatRebuildFilters(rows) {\n  const c = document.querySelector('#fcomm'), s = document.querySelector('#fsector');\n  if (c) c.innerHTML = `<option value=\"\">Toutes les communes</option>${[...new Set(rows.map(x => x.commune).filter(Boolean))].map(x => `<option>${esc(x)}</option>`).join('')}`;\n  if (s) s.innerHTML = `<option value=\"\">Tous les secteurs</option>${[...new Set(rows.map(x => x.sector).filter(Boolean))].map(x => `<option>${esc(x)}</option>`).join('')}`;\n  const p = document.querySelector('#fprogress'); if (p) p.value = '';\n}\n\nfunction fatRenderProvinceContent(unit, rows) {\n  const province = unit?.province || 'Province';\n  const box = document.querySelector('#provinceProjects');\n  const title = document.querySelector('#selectedProvinceTitle');\n  const meta = document.querySelector('#selectedProvinceMeta');\n  if (title) title.textContent = province;\n  if (meta) meta.textContent = `${rows.length} projet${rows.length > 1 ? 's' : ''} public${rows.length > 1 ? 's' : ''}`;\n  if (box) box.innerHTML = rows.length\n    ? rows.map(x => `<button class=\"province-project openproject\" data-id=\"${x.id}\"><b>${esc(x.title)}</b><span>${esc(x.commune || province)} · ${x.ai_progress ?? x.progress ?? 0}%</span></button>`).join('')\n    : `<div class=\"empty\"><b>${esc(province)}</b><br>Aucun projet public n’est encore enregistré pour cette province.</div>`;\n\n  const grid = document.querySelector('#projectGrid'); if (grid) grid.innerHTML = rows.length ? rows.map(projectCard).join('') : empty(`Aucun projet public publié pour ${province}.`);\n  const bars = document.querySelector('#bars'); if (bars) bars.innerHTML = fatBars(rows);\n  const label = document.querySelector('#provinceStat'); if (label) label.textContent = province;\n  const avg = rows.length ? Math.round(rows.reduce((a, x) => a + Number(x.ai_progress ?? x.progress ?? 0), 0) / rows.length) : 0;\n  const avgEl = document.querySelector('#provinceAvg'); if (avgEl) avgEl.textContent = `${avg}%`;\n  const commentsEl = document.querySelector('#provinceComments'); if (commentsEl) commentsEl.textContent = rows.reduce((a, x) => a + Number(x.comment_count || 0), 0);\n  fatRebuildFilters(rows);\n  bindProjectButtons();\n}\n\nasync function fatLoadProvince(province) {\n  const unit = (window.__fatNational?.units || []).find(u => fatNorm(u.province) === fatNorm(province));\n  if (!unit) return;\n  window.__fatNational.selected = unit;\n  document.querySelector('#provinceProjects').innerHTML = '<div class=\"empty\">Chargement des projets…</div>';\n  try {\n    const d = await fatMapApi(`/projects?slug=${encodeURIComponent(unit.slug)}`);\n    state.fatshi = d.projects || [];\n    fatRenderProvinceContent(unit, state.fatshi);\n    fatRenderSvgMap();\n  } catch (err) {\n    document.querySelector('#provinceProjects').innerHTML = `<div class=\"notice err\">${esc(err.message)}</div>`;\n  }\n}\n\nfatshimetrie = async function () {\n  const initialProvince = state.settings?.province || 'Kinshasa';\n  const [units, geo, initial] = await Promise.all([\n    fatMapApi('/provinces'),\n    fatMapApi('/geojson'),\n    fatMapApi(`/projects?province=${encodeURIComponent(initialProvince)}`)\n  ]);\n  const selected = units.find(u => fatNorm(u.province) === fatNorm(initial.province || initialProvince)) || units.find(u => u.slug === 'kinshasa') || units[0];\n  window.__fatNational = { units, geo, selected };\n  state.fatshi = initial.projects || [];\n\n  const totalProjects = units.reduce((a, u) => a + Number(u.project_count || 0), 0);\n  const avg = state.fatshi.length ? Math.round(state.fatshi.reduce((a, x) => a + Number(x.ai_progress ?? x.progress ?? 0), 0) / state.fatshi.length) : 0;\n  const hero = state.fatshi.filter(x => safe(x.image_url)).slice(0, 5);\n  const heroSlides = hero.length ? hero.map((x, i) => `<div class=\"fatshi-slide\" style=\"background-image:linear-gradient(90deg,rgba(2,25,52,.88),rgba(4,74,128,.44),rgba(2,25,52,.18)),url('${safe(x.image_url)}');animation-delay:${i * 5}s\"><div class=\"wrap\"><span>FATSHIMÉTRIE · ${esc(x.commune || selected.province)}</span><h1>${esc(x.title)}</h1><p>${esc(x.summary)}</p><button class=\"btn gold openproject\" data-id=\"${x.id}\">Voir le projet & le chat</button></div></div>`).join('') : `<div class=\"fatshi-slide fatshi-slide-fallback\" style=\"opacity:1;animation:none\"><div class=\"wrap\"><span>FATSHIMÉTRIE · RDC</span><h1>Explorez les projets publics par province</h1><p>Survolez une province sur la carte, puis cliquez pour consulter les projets qui y sont enregistrés.</p></div></div>`;\n\n  return `<section class=\"fatshi-immersive\">${heroSlides}<div class=\"fatshi-hero-label\"><div class=\"wrap\"><b>FATSHIMÉTRIE</b><span>La carte citoyenne des projets publics en RDC</span></div></div></section>\n  <section class=\"section fatdash\"><div class=\"wrap\">\n    <div class=\"stats4\"><div><strong>${totalProjects}</strong><span>Projets suivis en RDC</span></div><div><strong id=\"provinceAvg\">${avg}%</strong><span>Avancement moyen — province sélectionnée</span></div><div><strong id=\"provinceComments\">${state.fatshi.reduce((a,x)=>a+Number(x.comment_count||0),0)}</strong><span>Contributions citoyennes</span></div><div><strong id=\"provinceStat\">${esc(selected.province)}</strong><span>Province sélectionnée</span></div></div>\n    <div class=\"rdc-section rdc-real-section\">\n      <div class=\"rdc-copy\"><span class=\"eyebrow\">CARTE DE LA RDC</span><h2 id=\"selectedProvinceTitle\">${esc(selected.province)}</h2><p id=\"selectedProvinceMeta\">${state.fatshi.length} projet${state.fatshi.length > 1 ? 's' : ''} public${state.fatshi.length > 1 ? 's' : ''}</p><p>Survolez une province : <b>« Voir plus de détails »</b> apparaît. Cliquez sur la province pour afficher ses projets.</p><div id=\"provinceProjects\" class=\"province-projects\">${state.fatshi.length ? state.fatshi.map(x => `<button class=\"province-project openproject\" data-id=\"${x.id}\"><b>${esc(x.title)}</b><span>${esc(x.commune || selected.province)} · ${x.ai_progress ?? x.progress ?? 0}%</span></button>`).join('') : empty('Aucun projet public publié pour cette province.')}</div></div>\n      <div class=\"rdc-map-shell\"><svg id=\"rdcMapSvg\" class=\"rdc-map-svg\" aria-label=\"Carte interactive des 26 provinces de la République Démocratique du Congo\"></svg><div id=\"rdcMapTooltip\" class=\"rdc-map-tooltip\" hidden></div><div class=\"rdc-map-legend\"><span><i></i> Province</span><span><i class=\"with-project\"></i> Projet(s) disponible(s)</span></div></div>\n    </div>\n    <div class=\"fatfilters\"><select id=\"fcomm\"><option value=\"\">Toutes les communes</option>${[...new Set(state.fatshi.map(x=>x.commune).filter(Boolean))].map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id=\"fsector\"><option value=\"\">Tous les secteurs</option>${[...new Set(state.fatshi.map(x=>x.sector).filter(Boolean))].map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id=\"fprogress\"><option value=\"\">Tous niveaux</option><option value=\"0-25\">0–25%</option><option value=\"26-50\">26–50%</option><option value=\"51-75\">51–75%</option><option value=\"76-100\">76–100%</option></select></div>\n    <div class=\"chartbox\"><h3>Évolution des projets</h3><div id=\"bars\">${fatBars(state.fatshi)}</div></div>\n    <div id=\"projectGrid\" class=\"projectgrid\">${state.fatshi.length ? state.fatshi.map(projectCard).join('') : empty('Aucun projet public publié pour cette province.')}</div>\n  </div></section>`;\n};\n\nbindFatshi = function () {\n  fatRenderSvgMap();\n  document.querySelectorAll('.rdc-province-shape').forEach(path => {\n    const province = path.dataset.province;\n    path.addEventListener('mouseenter', e => fatTooltipShow(e, province));\n    path.addEventListener('mousemove', e => fatTooltipShow(e, province));\n    path.addEventListener('mouseleave', fatTooltipHide);\n    path.addEventListener('focus', e => fatTooltipShow(e, province));\n    path.addEventListener('blur', fatTooltipHide);\n    path.addEventListener('click', () => fatLoadProvince(province));\n    path.addEventListener('keydown', e => {\n      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fatLoadProvince(province); }\n    });\n  });\n\n  const apply = () => {\n    const c = document.querySelector('#fcomm')?.value || '', s = document.querySelector('#fsector')?.value || '', p = document.querySelector('#fprogress')?.value || '';\n    let rows = fatSelectedRows().filter(x => (!c || x.commune === c) && (!s || x.sector === s));\n    if (p) { const [a, b] = p.split('-').map(Number); rows = rows.filter(x => { const n = Number(x.ai_progress ?? x.progress ?? 0); return n >= a && n <= b; }); }\n    document.querySelector('#projectGrid').innerHTML = rows.length ? rows.map(projectCard).join('') : empty('Aucun projet avec ces filtres.');\n    document.querySelector('#bars').innerHTML = fatBars(rows);\n    bindProjectButtons();\n  };\n  ['#fcomm', '#fsector', '#fprogress'].forEach(sel => document.querySelector(sel)?.addEventListener('change', apply));\n  bindProjectButtons();\n};\n\n(() => {\n  const style = document.createElement('style');\n  style.id = 'fatshimetrie-real-map-style';\n  style.textContent = `\n    .rdc-real-section{grid-template-columns:minmax(300px,.72fr) minmax(480px,1.28fr);align-items:stretch}\n    .rdc-map-shell{position:relative;min-height:580px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(150deg,#e9f7ff,#d9edf8 58%,#f4fbff);padding:16px;overflow:hidden;box-shadow:0 12px 35px rgba(3,47,95,.08)}\n    .rdc-map-svg{display:block;width:100%;height:540px;filter:drop-shadow(0 10px 14px rgba(5,47,95,.14))}\n    .rdc-province-shape{fill:#d9edf8;stroke:#fff;stroke-width:1.4;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .16s ease,filter .16s ease,stroke .16s ease}\n    .rdc-province-shape.has-projects{fill:#8ecdf1}\n    .rdc-province-shape:hover,.rdc-province-shape:focus{fill:#f7c948;stroke:#052f5f;stroke-width:2;outline:none;filter:brightness(1.02)}\n    .rdc-province-shape.selected{fill:#0874c9;stroke:#052f5f;stroke-width:2.2}\n    .rdc-map-tooltip{position:absolute;z-index:8;min-width:175px;max-width:215px;background:#052f5f;color:#fff;border-radius:12px;padding:11px 13px;box-shadow:0 12px 30px rgba(3,30,59,.24);pointer-events:none}\n    .rdc-map-tooltip strong,.rdc-map-tooltip span,.rdc-map-tooltip b{display:block}.rdc-map-tooltip strong{font-size:14px}.rdc-map-tooltip span{font-size:11px;color:#d8ebf8;margin:3px 0 7px}.rdc-map-tooltip b{font-size:11px;color:#f7c948}\n    .rdc-map-legend{position:absolute;left:18px;bottom:15px;display:flex;gap:12px;flex-wrap:wrap;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:10px;color:#40566b}\n    .rdc-map-legend span{display:flex;align-items:center;gap:5px}.rdc-map-legend i{width:12px;height:12px;border-radius:3px;background:#d9edf8;border:1px solid #b9d7ea}.rdc-map-legend i.with-project{background:#8ecdf1}\n    .fatshi-slide-fallback{background:linear-gradient(125deg,#031e3b,#0874c9)}\n    @media(max-width:900px){.rdc-real-section{grid-template-columns:1fr}.rdc-map-shell{min-height:500px}.rdc-map-svg{height:470px}}\n    @media(max-width:560px){.rdc-map-shell{min-height:410px;padding:7px}.rdc-map-svg{height:390px}.rdc-map-legend{position:static;margin:0 8px 8px}.rdc-map-tooltip{min-width:155px}}\n  `;\n  document.head.appendChild(style);\n  if (location.pathname === '/fatshimetrie') setTimeout(() => render(), 0);\n})();\n";const safePatch=patch.replace(/<\/script/gi,'<\\/script');html=html.replace(/<\/body>/i,'<script>'+safePatch+'<\/script></body>');html=html.replace(/<\/body>/i,"\n<script>\n(function(){\n if(location.pathname!=='/' && location.pathname!=='') return;\n const renderHome=()=>{\n  document.title='Jeunesse Connect | CPJ';\n  document.body.innerHTML=`\n  <style>\n  :root{--navy:#041f3d;--blue:#075fae;--royal:#0874c9;--red:#ce2939;--gold:#f4c542;--ink:#0a2540;--muted:#5d7185;--line:#dce7f0;--soft:#f5f9fc}\n  *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",sans-serif;color:var(--ink);background:#fff}\n  a{text-decoration:none;color:inherit}.jc-nav{position:absolute;z-index:20;top:0;left:0;right:0;height:84px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,5vw,76px);color:#fff;border-bottom:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px)}\n  .jc-brand{display:flex;align-items:center;gap:12px;font-weight:800}.jc-mark{width:44px;height:44px;border-radius:50%;display:g
