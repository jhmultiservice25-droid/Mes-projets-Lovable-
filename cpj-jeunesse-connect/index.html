<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#005aa7">
  <title>Jeunesse Connect | CPJ</title>
  <style>
    body{margin:0;font-family:Arial,sans-serif;color:#052f5f}
    #boot{min-height:100vh;display:grid;place-items:center;text-align:center}
    #boot b{font-size:24px}
    #boot p{color:#62748a}
  </style>
</head>
<body>
  <div id="boot">
    <div>
      <b>Jeunesse Connect</b>
      <p>Chargement de la plateforme…</p>
    </div>
  </div>
  <script>
    (async()=>{
      try{
        const r=await fetch('https://xpxvadpgsrfjqbtdmgcw.supabase.co/functions/v1/site-snapshot-api?name=h0.txt',{cache:'no-store'});
        if(!r.ok) throw Error('source '+r.status);
        const html=await r.text();
        document.open();
        document.write(html);
        document.close();
      }catch(e){
        document.body.innerHTML='<div style="padding:36px"><h2>Jeunesse Connect</h2><p>Le portail n’a pas pu charger.</p><small>'+String(e.message||e)+'</small></div>';
      }
    })();
  </script>
</body>
</html>
